defaults:
  - maniskill_rlt_stage2_residual_ac_mlp
  - _self_

runner:
  logger:
    experiment_name: "maniskill_rlt_stage2_residual_entropy_ac_mlp"

algorithm:
  backup_entropy: True
  entropy_tuning:
    enable: True
    alpha_type: softplus
    initial_alpha: 0.001
    # Entropy target in nats over the full 8x10 flattened action chunk.
    # -85 corresponds to per-step std ~0.08, keeping residual exploration
    # small and close to the fixed-std regime; larger values let the learned
    # std drift to ~0.2+, which degrades Q-learning on this sparse task.
    target_entropy: -85.0

actor:
  model:
    actor_std_type: "learned"
    # Cap the learned std at exp(-2.5) ~= 0.08 so residual rollouts stay
    # close to deterministic (residual_scale=0.1 => effective residual std
    # ~0.008), matching the fixed-std behavior more closely.
    log_std_max: -2.5
    use_tanh_logprob_correction: True
